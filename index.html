<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MOUTHPIECE</title>
  <meta name="description" content="Personal content engine. News → breakdown → video.">
  <meta name="theme-color" content="#0E0D0B">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar" id="topbar">
    <h1 class="brand"><a href="#/">Mouthpiece</a></h1>
    <span class="today-date" id="today-date"></span>
    <a class="drop-btn" href="#/drop" aria-label="Throw an idea">+ Idea</a>
  </header>

  <!-- TODAY: what needs Sean, ordered by urgency -->
  <main id="view-today" class="view" hidden></main>

  <!-- VIDEOS: all videos, pillar filter chips -->
  <main id="view-videos" class="view" hidden>
    <h2 class="view-title">Videos</h2>
    <nav class="chips" id="videos-chips" aria-label="Filter by pillar"></nav>
    <div id="videos-list"></div>
  </main>

  <!-- NEWS: all news, pillar filter chips -->
  <main id="view-news" class="view" hidden>
    <h2 class="view-title">News</h2>
    <nav class="chips" id="news-chips" aria-label="Filter by pillar"></nav>
    <div id="news-list"></div>
  </main>

  <!-- NEWS BREAKDOWN -->
  <main id="view-item" class="view" hidden>
    <a id="item-back" class="back" href="#/news">&larr; News</a>
    <article id="item-detail"></article>
  </main>

  <!-- VIDEO (CARD) -->
  <main id="view-card" class="view has-actionbar" hidden>
    <a id="card-back" class="back" href="#/videos">&larr; Videos</a>
    <article id="card-detail"></article>
  </main>

  <!-- STUDIO: recording mode, nothing else on screen -->
  <main id="view-studio" class="studio" hidden></main>

  <!-- DROP -->
  <main id="view-drop" class="view" hidden>
    <a class="back" href="#/">&larr; Today</a>
    <h2 class="view-title">Throw an idea</h2>
    <p class="hint">Raw. Unfiltered. Tap a pillar to file it — talking points come later.</p>
    <textarea id="drop-text" rows="5" placeholder="what's the idea…" autocomplete="off"></textarea>
    <div id="drop-pillars" class="drop-pillars"></div>
    <button id="drop-skip" type="button">Drop it — file later</button>
  </main>

  <!-- sticky action bar (video card) -->
  <div class="actionbar" id="actionbar" hidden></div>

  <!-- bottom nav -->
  <nav class="bottomnav" id="bottomnav" aria-label="Main">
    <a href="#/" data-tab="today">Today</a>
    <a href="#/videos" data-tab="videos">Videos</a>
    <a href="#/news" data-tab="news">News</a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
