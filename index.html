<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MOUTHPIECE</title>
  <meta name="description" content="Personal content engine. News → breakdown → video.">
  <meta name="theme-color" content="#0E0D0B">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <h1 class="brand"><a href="#/">Mouthpiece</a></h1>
    <a class="drop-btn" href="#/drop" aria-label="Throw an idea">+ Drop</a>
  </header>

  <!-- HOME: four pillars -->
  <main id="view-home" class="view" hidden>
    <div id="pillar-tiles"></div>
    <a id="unfiled-row" class="unfiled" href="#/pillar/unfiled" hidden></a>
  </main>

  <!-- PILLAR: two tabs — Videos (what you'll say) | News (what happened) -->
  <main id="view-pillar" class="view" hidden>
    <a class="back" href="#/">&larr; Pillars</a>
    <h2 id="pillar-title" class="view-title"></h2>
    <nav id="pillar-tabs" class="tabs" role="tablist" aria-label="Videos or news"></nav>
    <div id="tab-videos"></div>
    <div id="tab-news" hidden></div>
  </main>

  <!-- NEWS BREAKDOWN -->
  <main id="view-news" class="view" hidden>
    <a id="news-back" class="back" href="#/">&larr; News</a>
    <article id="news-detail"></article>
  </main>

  <!-- VIDEO (CARD) -->
  <main id="view-card" class="view" hidden>
    <a id="card-back" class="back" href="#/">&larr; Videos</a>
    <article id="card-detail"></article>
  </main>

  <!-- DROP -->
  <main id="view-drop" class="view" hidden>
    <a class="back" href="#/">&larr; Pillars</a>
    <h2 class="view-title">Throw an idea</h2>
    <p class="hint">Raw. Unfiltered. Tap a pillar to file it — talking points come later.</p>
    <textarea id="drop-text" rows="5" placeholder="what's the idea…" autocomplete="off"></textarea>
    <div id="drop-pillars" class="drop-pillars"></div>
    <button id="drop-skip" type="button">Drop it — file later</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
